<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="cye-flow-title cye-flow-desc">
  <title id="cye-flow-title">From PED Daily Management to CYE Alert Notification</title>
  <desc id="cye-flow-desc">A left-to-right enterprise workflow from source data through excluded filter workflows, an integrated CYE criteria system, event candidates, user confirmation, and alert notification.</desc>
  <defs>
    <linearGradient id="systemFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f4f0ff"/>
    </linearGradient>
    <linearGradient id="candidateFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0edff"/>
      <stop offset="1" stop-color="#e4dcff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1d3557" flood-opacity=".12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#2374c6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#238b68"/>
    </marker>
    <style>
      .eyebrow { font: 700 15px 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; }
      .card-title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #173b68; }
      .card-title-light { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .label { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #52708f; }
      .small { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .small-light { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #eaf4ff; }
      .system-title { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #304d83; }
      .banner-text { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #173b68; }
      .banner-subtext { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #54708c; }
    </style>
  </defs>

  <rect width="1600" height="700" fill="#ffffff"/>

  <!-- Source data -->
  <g filter="url(#shadow)">
    <rect x="45" y="235" width="260" height="178" rx="22" fill="#174d86"/>
    <rect x="45" y="235" width="260" height="8" rx="4" fill="#54a8ed"/>
  </g>
  <g transform="translate(78 275)" fill="none" stroke="#bfe1ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="9" width="59" height="51" rx="6"/>
    <path d="M0 23h59M17 9v51M39 9v51"/>
    <path d="M4 77h51M12 88h35"/>
  </g>
  <text x="155" y="302" class="card-title-light">PED Daily</text>
  <text x="155" y="331" class="card-title-light">Management</text>
  <text x="175" y="381" text-anchor="middle" class="small-light">Source Data</text>

  <!-- Pre-processing -->
  <line x1="325" y1="324" x2="380" y2="324" stroke="#2374c6" stroke-width="7" marker-end="url(#arrowBlue)"/>
  <g filter="url(#shadow)">
    <rect x="400" y="255" width="235" height="138" rx="20" fill="#e9eff8" stroke="#a9bdd2" stroke-width="2"/>
  </g>
  <g transform="translate(430 288)" fill="none" stroke="#55769b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0h53L39 19v31L18 39V19Z"/>
    <path d="M72 10h34M72 25h25M72 40h17"/>
  </g>
  <text x="465" y="326" class="card-title">Excluded Filter</text>
  <text x="465" y="355" class="card-title">WFs</text>
  <text x="518" y="432" text-anchor="middle" class="label">Pre-processing</text>

  <!-- Integrated CYE system -->
  <line x1="655" y1="324" x2="705" y2="324" stroke="#2374c6" stroke-width="7" marker-end="url(#arrowBlue)"/>
  <rect x="730" y="75" width="825" height="465" rx="30" fill="url(#systemFill)" stroke="#8fb8e5" stroke-width="3"/>
  <rect x="755" y="58" width="370" height="45" rx="22" fill="#ffffff" stroke="#8fb8e5" stroke-width="2"/>
  <circle cx="783" cy="80" r="9" fill="#427cc8"/>
  <text x="805" y="87" class="system-title">Integrated CYE Criteria System</text>

  <!-- Wafer data -->
  <g filter="url(#shadow)">
    <rect x="765" y="210" width="205" height="180" rx="20" fill="#3f88d3"/>
  </g>
  <g transform="translate(795 245)">
    <circle cx="34" cy="34" r="31" fill="#d8edff" stroke="#ffffff" stroke-width="4"/>
    <path d="M8 51h52M14 25h40M34 4v60M8 34h52" stroke="#6ba9df" stroke-width="2" opacity=".8"/>
    <circle cx="113" cy="19" r="9" fill="#bce3ff"/>
    <circle cx="139" cy="45" r="9" fill="#bce3ff"/>
    <circle cx="111" cy="70" r="9" fill="#bce3ff"/>
    <path d="M101 19h-12M127 45h-22M101 70H89" stroke="#bce3ff" stroke-width="3"/>
  </g>
  <text x="867" y="342" text-anchor="middle" class="card-title-light">Wafer Data</text>
  <text x="867" y="431" text-anchor="middle" class="label">Wafer-level Input</text>

  <!-- Candidate arrow -->
  <line x1="990" y1="300" x2="1030" y2="300" stroke="#2374c6" stroke-width="7" marker-end="url(#arrowBlue)"/>

  <!-- Event candidates -->
  <g filter="url(#shadow)">
    <rect x="1050" y="175" width="290" height="250" rx="22" fill="url(#candidateFill)" stroke="#7564c7" stroke-width="3"/>
  </g>
  <g transform="translate(1080 213)">
    <rect x="0" y="12" width="47" height="35" rx="7" fill="#6d5cc2"/>
    <rect x="58" y="0" width="47" height="35" rx="7" fill="#9d7bd8"/>
    <rect x="29" y="48" width="47" height="35" rx="7" fill="#4d9dc6"/>
    <circle cx="15" cy="27" r="4" fill="#ffffff"/><circle cx="73" cy="15" r="4" fill="#ffffff"/><circle cx="44" cy="63" r="4" fill="#ffffff"/>
    <path d="M20 58L55 31M50 26l17-7M45 56l-1-20" stroke="#ffffff" stroke-width="3" opacity=".9"/>
  </g>
  <text x="1195" y="323" text-anchor="middle" class="card-title">Event Candidates</text>
  <text x="1195" y="355" text-anchor="middle" class="small">Mixed Candidate State</text>
  <text x="1195" y="378" text-anchor="middle" class="small">Not a Confirmed Event</text>
  <text x="1195" y="462" text-anchor="middle" class="label">User Review Required</text>

  <!-- User confirmation condition -->
  <line x1="1360" y1="300" x2="1400" y2="300" stroke="#238b68" stroke-width="6" marker-end="url(#arrowGreen)"/>
  <g transform="translate(1352 250)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#238b68" stroke-width="3"/>
    <path d="M-9 0l6 7L10-8" fill="none" stroke="#238b68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1372" y="221" text-anchor="middle" class="small" fill="#238b68">User Confirmation</text>
  <text x="1372" y="239" text-anchor="middle" class="small" fill="#238b68">Required</text>

  <!-- Alert notification -->
  <g filter="url(#shadow)">
    <rect x="1415" y="210" width="115" height="180" rx="20" fill="#238b68"/>
  </g>
  <g transform="translate(1451 245)" fill="none" stroke="#d8fff0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 45h39l-5-8V24c0-13-7-21-15-21S17 11 17 24v13Z"/>
    <path d="M27 52c1 7 10 7 11 0"/>
    <path d="M31 0v-6"/>
  </g>
  <text x="1472" y="311" text-anchor="middle" class="card-title-light" font-size="18">Alert</text>
  <text x="1472" y="338" text-anchor="middle" class="card-title-light" font-size="18">Notification</text>
  <g transform="translate(1430 425)">
    <rect x="0" y="0" width="34" height="27" rx="13" fill="#d8fff0"/><rect x="40" y="0" width="34" height="27" rx="13" fill="#d8fff0"/><rect x="80" y="0" width="34" height="27" rx="13" fill="#d8fff0"/>
    <text x="17" y="19" text-anchor="middle" style="font:600 12px 'Segoe UI',Arial,sans-serif;fill:#187153">PED</text>
    <text x="57" y="19" text-anchor="middle" style="font:600 12px 'Segoe UI',Arial,sans-serif;fill:#187153">PEI</text>
    <text x="97" y="19" text-anchor="middle" style="font:600 12px 'Segoe UI',Arial,sans-serif;fill:#187153">CE</text>
  </g>

  <!-- Bottom key message -->
  <rect x="220" y="590" width="1160" height="78" rx="24" fill="#eef9f5" stroke="#b4dfcf" stroke-width="2"/>
  <text x="800" y="622" text-anchor="middle" class="banner-text">Wafer Data → <tspan fill="#7056bd">Event Candidates</tspan> → <tspan fill="#238b68">User Confirmation</tspan> → <tspan fill="#238b68">Alert Notification</tspan></text>
  <text x="800" y="649" text-anchor="middle" class="banner-subtext">Candidate data must be reviewed before notification</text>
</svg>
