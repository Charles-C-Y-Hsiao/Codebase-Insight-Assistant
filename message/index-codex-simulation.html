<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>確認操作</title>

  <!-- tr -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-thin-rounded/css/uicons-thin-rounded.css" />
  <!-- tc -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-thin-chubby/css/uicons-thin-chubby.css" />
  <!-- rr -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css" />
  <!-- rc -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-chubby/css/uicons-regular-chubby.css" />
  <!-- ts -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-thin-straight/css/uicons-thin-straight.css" />
  <!-- br -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css" />
  <!-- sr -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css" />
  <!-- ss -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-straight/css/uicons-solid-straight.css" />

  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f5f3ff;
    }

    .modal {
      position: relative;
      width: min(460px, 100%);
      padding: 32px;
      border: 1px solid #ddd6fe;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(76, 29, 149, .13);
    }

    .close-button {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      color: #6d28d9;
      border: 0;
      border-radius: 50%;
      background: #f3efff;
      font-size: 18px;
      cursor: pointer;
      transition: background-color .15s ease, transform .15s ease;
    }

    .close-button:hover {
      background: #e9ddff;
      transform: rotate(90deg);
    }

    h1 {
      margin: 4px 52px 28px 0;
      color: #171329;
      font-size: 30px;
      line-height: 1.25;
      letter-spacing: .01em;
    }

    .button-frame {
      min-height: 80px;
      padding: 13px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      border: 1px solid #d7c8ff;
      border-radius: 14px;
      background: #faf9ff;
    }

    .button-frame button {
      min-width: 96px;
      min-height: 48px;
      padding: 0 22px;
      border: 1px solid #c4b5fd;
      border-radius: 9px;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease, transform .15s ease;
    }

    .cancel {
      color: #6d28d9;
      background: #f3efff;
    }

    .confirm {
      color: #fff;
      border-color: #6d28d9 !important;
      background: #6d28d9;
    }

    .button-frame button:hover { transform: translateY(-1px); }
    .cancel:hover { background: #e9ddff; }
    .confirm:hover { background: #5b21b6; }

    @media (max-width: 420px) {
      body { padding: 16px; }
      .modal { padding: 24px; }
      .close-button { top: 12px; right: 12px; }
      h1 { margin-bottom: 22px; font-size: 27px; }
      .button-frame { min-height: 72px; padding: 10px; gap: 8px; }
      .button-frame button { min-width: 0; flex: 1; padding-inline: 12px; }
    }
  </style>
</head>
<body>
  <section class="modal" role="dialog" aria-labelledby="dialog-title" aria-modal="true">
    <button type="button" class="close-button" aria-label="關閉">
      <i class="fi fi-br-circle-xmark" aria-hidden="true"></i>
    </button>

    <h1 id="dialog-title">確認操作</h1>

    <div class="button-frame">
      <button type="button" class="cancel">Cancel</button>
      <button type="button" class="confirm">Confirm</button>
    </div>
  </section>
</body>
</html>
