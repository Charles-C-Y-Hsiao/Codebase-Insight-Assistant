<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>確認操作</title>

  <!-- tr -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-thin-rounded/css/uicons-thin-rounded.css" />
  <!-- tc -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-thin-chubby/css/uicons-thin-chubby.css" />
  <!-- rr -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css" />
  <!-- rc -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-chubby/css/uicons-regular-chubby.css" />
  <!-- ts -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-thin-straight/css/uicons-thin-straight.css" />
  <!-- br -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css" />
  <!-- bs -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-straight/css/uicons-bold-straight.css" />
  <!-- sr -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css" />
  <!-- ss -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-straight/css/uicons-solid-straight.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background-color: #eff6ff;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    #modal {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: min(420px, calc(100% - 40px));
      padding: 16px;
      box-sizing: border-box;
      border: 1px solid #93c5fd;
      border-radius: 10px;
      background-color: #f8fbff;
      box-shadow: 0 12px 30px rgba(30, 64, 175, 0.18);
    }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #dialog-title {
      color: #1d4ed8;
      font-size: 19px;
      font-weight: bold;
      line-height: 1.2;
    }

    #close-button {
      align-self: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
    }

    .close-button {
      flex: 0 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      padding: 0;
      color: #2563eb;
      border: 0;
      border-radius: 50%;
      background-color: transparent;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    .close-button i {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transform: translateY(2px);
    }

    .close-button:hover,
    .close-button:focus-visible {
      background-color: #dbeafe;
      transform: scale(1.05);
    }

    .input-label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: #1e3a8a;
      font-size: 14px;
      font-weight: 600;
    }

    #dialog-input {
      width: 100%;
      min-height: 88px;
      box-sizing: border-box;
      padding: 10px;
      resize: vertical;
      color: #172554;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      background-color: #fff;
      font: inherit;
    }

    #dialog-input:focus {
      outline: 2px solid #bfdbfe;
      border-color: #2563eb;
    }

    #button-frame {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
    }

    #button-icon {
      color: #3b82f6;
      font-size: 16px;
    }

    #button-frame .cancel {
      margin-left: auto;
    }

    .button-frame button {
      padding: 6px 12px;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .cancel {
      color: #1d4ed8;
      background-color: #eff6ff;
    }

    .confirm {
      color: #fff;
      border-color: #2563eb !important;
      background-color: #2563eb;
    }

    .button-frame button:hover {
      opacity: 0.85;
    }

    #modal-output {
      display: none;
      width: min(420px, calc(100% - 40px));
      box-sizing: border-box;
      padding: 12px 16px;
      color: #1e3a8a;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      background-color: #dbeafe;
      overflow-wrap: anywhere;
    }

    #modal-output.is-visible {
      display: block;
    }
  </style>
</head>
<body>
  <main class="page">
    <section id="modal" class="modal" role="dialog" aria-labelledby="dialog-title" aria-modal="true">
      <div class="dialog-header">
        <span id="dialog-title" class="dialog-title">確認操作</span>
        <button id="close-button" type="button" class="close-button" aria-label="關閉">
          <i class="fi fi-br-circle-xmark" aria-hidden="true"></i>
        </button>
      </div>

      <label class="input-label" for="dialog-input">
        請輸入內容
        <textarea id="dialog-input" placeholder="在此輸入文字"></textarea>
      </label>

      <div id="button-frame" class="button-frame">
        <i id="button-icon" class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
        <button type="button" class="cancel">Cancel</button>
        <button type="button" class="confirm">Confirm</button>
      </div>
    </section>

    <output id="modal-output" aria-live="polite"></output>
  </main>

  <script>
    const input = document.querySelector('#dialog-input');
    const output = document.querySelector('#modal-output');
    const confirmButton = document.querySelector('.confirm');
    const cancelButton = document.querySelector('.cancel');
    const closeButton = document.querySelector('#close-button');

    function showInputContent() {
      const value = input.value.trim();
      output.textContent = value || '尚未輸入內容。';
      output.classList.add('is-visible');
    }

    function clearInput() {
      input.value = '';
      output.textContent = '';
      output.classList.remove('is-visible');
    }

    confirmButton.addEventListener('click', showInputContent);
    cancelButton.addEventListener('click', clearInput);
    closeButton.addEventListener('click', clearInput);
  </script>
</body>
</html>
